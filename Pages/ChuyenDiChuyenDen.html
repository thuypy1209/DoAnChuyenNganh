<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghiệp vụ: Chuyển đi, Chuyển đến</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-8">

        <div class="mb-6">
            <p class="text-sm text-gray-500">NGHIỆP VỤ QUẢN LÝ ĐOÀN VIÊN / CHUYỂN ĐI, CHUYỂN ĐẾN</p>
            <h1 class="text-3xl font-bold text-gray-800">Nghiệp vụ: Chuyển đi, Chuyển đến</h1>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-bold mb-4">1. Tìm kiếm và chọn Đoàn viên</h2>
            <div class="flex items-center space-x-2">
                <input type="text" placeholder="Nhập tên hoặc mã đoàn viên..." class="flex-grow border border-gray-300 rounded-md p-2">
                <button class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">Tìm kiếm</button>
            </div>

            <div class="mt-4 overflow-y-auto max-h-72 border rounded-md">
                <table class="w-full">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="p-3 w-10"><input type="checkbox" title="Chọn tất cả"></th>
                            <th class="p-3 text-left font-semibold text-gray-600">Họ và Tên</th>
                            <th class="p-3 text-left font-semibold text-gray-600">Mã định danh</th>
                            <th class="p-3 text-left font-semibold text-gray-600">Chi đoàn</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        <tr>
                            <td class="p-3"><input type="checkbox"></td>
                            <td class="p-3">Nguyễn Văn A</td>
                            <td class="p-3">12345678</td>
                            <td class="p-3">Chi đoàn demo 3.1</td>
                        </tr>
                        <tr>
                            <td class="p-3"><input type="checkbox"></td>
                            <td class="p-3">Trần Thị B</td>
                            <td class="p-3">87654321</td>
                            <td class="p-3">Chi đoàn demo 3.1</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
             <h2 class="text-xl font-bold mb-4">2. Thông tin chuyển sinh hoạt Đoàn</h2>
             <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="don-vi-chuyen-den" class="block text-sm font-medium text-gray-700">Đơn vị chuyển đến (*)</label>
                    <input type="text" id="don-vi-chuyen-den" placeholder="Ví dụ: Đoàn trường Đại học XYZ" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                 <div>
                    <label for="ngay-chuyen" class="block text-sm font-medium text-gray-700">Ngày chuyển (*)</label>
                    <input type="date" id="ngay-chuyen" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div class="md:col-span-2">
                     <label for="ly-do-chuyen" class="block text-sm font-medium text-gray-700">Lý do chuyển</label>
                     <textarea id="ly-do-chuyen" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                </div>
             </div>
             <div class="mt-6 flex justify-end">
                <button class="bg-green-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-green-700 flex items-center">
                    <i class="fas fa-check mr-2"></i> Thực hiện chuyển
                </button>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/main.js"></script>
    <script src="/js/chuyenDiChuyenDen.js"></script> 
</body>
</html>
