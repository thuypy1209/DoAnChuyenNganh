<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trung tâm tin nhắn Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .active-user { background-color: #eff6ff; border-left: 4px solid #2563eb; }
        #chatContent { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
    <div class="bg-white h-16 border-b flex items-center px-6 justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-900 rounded-full flex items-center justify-center text-white">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="font-bold text-xl text-blue-900">Trung tâm tin nhắn Admin</h2>
        </div>
        <div id="status" class="flex items-center gap-2 text-sm text-gray-500 font-medium">
            <span class="w-3 h-3 bg-gray-400 rounded-full animate-pulse"></span> Đang kết nối...
        </div>
    </div>

    <div class="flex flex-grow overflow-hidden">
        <div class="w-80 bg-white border-r flex flex-col shadow-lg z-10">
            <div class="p-4 border-b bg-gray-50">
                <input type="text" placeholder="Tìm sinh viên..." class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div id="userList" class="flex-grow overflow-y-auto">
                <p class="text-center text-gray-400 text-xs mt-10">Chưa có tin nhắn mới</p>
            </div>
        </div>

        <div class="flex-grow flex flex-col bg-gray-50 relative">
            <div id="welcomeScreen" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 bg-gray-50 z-20">
                <i class="far fa-comments text-6xl mb-4"></i>
                <p>Chọn một sinh viên từ danh sách để bắt đầu hỗ trợ</p>
            </div>

            <div id="chatHeader" class="h-14 bg-white border-b px-6 flex items-center justify-between hidden shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 id="headerName" class="font-bold text-gray-800">...</h3>
                </div>
            </div>

            <div id="chatContent" class="flex-grow p-4 overflow-y-auto hidden flex flex-col gap-3"></div>

            <div id="chatInputArea" class="p-4 bg-white border-t hidden shadow-inner">
                <div class="flex gap-2 max-w-4xl mx-auto">
                    <input type="text" id="adminInput" class="flex-grow border rounded-full px-5 py-2.5 outline-none focus:border-blue-500 shadow-sm" placeholder="Nhập tin nhắn phản hồi...">
                    <button onclick="sendReply()" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-full w-11 h-11 flex items-center justify-center transition-transform active:scale-95 shadow-md">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.js"></script>
    <script>
        let currentUserId = null;
        const messagesStore = {}; // Lưu trữ tin nhắn tạm thời theo từng sinh viên
        const token = localStorage.getItem('accessToken');

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5114/chatHub", {
                accessTokenFactory: () => token
            })
            .withAutomaticReconnect()
            .build();

        async function start() {
            try {
                await connection.start();
                const statusEl = document.getElementById("status");
                statusEl.innerHTML = '<span class="w-3 h-3 bg-green-500 rounded-full"></span> Đang trực tuyến';
                
                const adminName = localStorage.getItem('userName') || "Admin";
                // Đăng ký quyền Admin với Server
                await connection.invoke("JoinChat", "Admin", adminName, "Admin");
            } catch (err) { 
                console.error("SignalR Connection Error: ", err);
                setTimeout(start, 5000); 
            }
        }

        // 1. Lắng nghe tin nhắn từ Sinh viên
        connection.on("ReceiveMessageFromUser", (userId, userName, message) => {
            if (!messagesStore[userId]) messagesStore[userId] = [];
            
            // HTML tin nhắn của sinh viên (Bên trái)
            const msgHtml = `
                <div class="flex flex-col items-start mb-2">
                    <span class="bg-white px-4 py-2 rounded-2xl rounded-bl-none shadow-sm border border-gray-100 text-gray-800 text-sm max-w-[80%] break-words">
                        ${message}
                    </span>
                    <span class="text-[10px] text-gray-400 mt-1 ml-1">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                </div>`;
            
            messagesStore[userId].push(msgHtml);
            updateUserList(userId, userName, message);

            // Nếu Admin đang mở đúng khung chat của người gửi thì hiển thị luôn
            if (currentUserId === userId) {
                const chat = document.getElementById("chatContent");
                chat.insertAdjacentHTML('beforeend', msgHtml);
                chat.scrollTop = chat.scrollHeight;
            } else {
                // Thông báo có tin nhắn mới cho user chưa chọn
                const item = document.getElementById(`user_item_${userId}`);
                if(item) item.classList.add("bg-blue-50", "font-bold");
            }
        });

        // 2. Cập nhật danh sách người dùng ở cột trái
        function updateUserList(userId, userName, lastMsg) {
            const list = document.getElementById("userList");
            const empty = list.querySelector('.text-center'); 
            if(empty) empty.remove();
            
            // Nếu sinh viên đã có trong danh sách, đưa lên đầu
            let item = document.getElementById(`user_item_${userId}`);
            if(item) item.remove();

            const html = `
                <div id="user_item_${userId}" onclick="openChat('${userId}', '${userName}')" 
                     class="p-4 border-b hover:bg-blue-50 cursor-pointer transition-colors flex flex-col gap-1 ${currentUserId === userId ? 'active-user' : ''}">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm text-blue-900">${userName}</span>
                        <span class="text-[10px] text-gray-400">${userId}</span>
                    </div>
                    <div class="text-xs text-gray-500 truncate italic">${lastMsg}</div>
                </div>`;
            list.insertAdjacentHTML('afterbegin', html);
        }

        // 3. Mở khung chat khi chọn sinh viên
        function openChat(userId, userName) {
            currentUserId = userId;
            document.getElementById("welcomeScreen").classList.add("hidden");
            document.getElementById("chatHeader").classList.remove("hidden");
            document.getElementById("chatContent").classList.remove("hidden");
            document.getElementById("chatInputArea").classList.remove("hidden");
            document.getElementById("headerName").innerText = userName;
            
            // Xóa dấu hiệu tin nhắn mới (active màu)
            const item = document.getElementById(`user_item_${userId}`);
            if(item) {
                document.querySelectorAll('#userList > div').forEach(el => el.classList.remove('active-user'));
                item.classList.add('active-user');
                item.classList.remove('bg-blue-50', 'font-bold');
            }

            const chat = document.getElementById("chatContent");
            chat.innerHTML = (messagesStore[userId] || []).join('');
            chat.scrollTop = chat.scrollHeight;
            document.getElementById("adminInput").focus();
        }

        // 4. Gửi tin phản hồi cho Sinh viên
        async function sendReply() {
            const input = document.getElementById("adminInput");
            const msg = input.value.trim();
            if(msg && currentUserId) {
                // HTML tin nhắn của Admin (Bên phải)
                const myMsg = `
                    <div class="flex flex-col items-end mb-2">
                        <span class="bg-blue-600 text-white px-4 py-2 rounded-2xl rounded-br-none shadow-md text-sm max-w-[80%] break-words">
                            ${msg}
                        </span>
                        <span class="text-[10px] text-gray-400 mt-1 mr-1">Vừa xong</span>
                    </div>`;
                
                if(!messagesStore[currentUserId]) messagesStore[currentUserId] = [];
                messagesStore[currentUserId].push(myMsg);
                document.getElementById("chatContent").insertAdjacentHTML('beforeend', myMsg);
                
                // Gọi hàm C# trong ChatHub
                await connection.invoke("SendMessageToUser", currentUserId, msg);
                
                input.value = "";
                document.getElementById("chatContent").scrollTop = document.getElementById("chatContent").scrollHeight;
            }
        }

        // Sự kiện phím Enter
        document.getElementById("adminInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendReply();
        });

        start();
    </script>
</body>
</html>
