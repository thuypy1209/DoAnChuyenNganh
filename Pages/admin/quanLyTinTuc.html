<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tin Tức - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen">
        <div class="w-64 bg-blue-900 text-white p-5 hidden md:block">
            <h2 class="text-2xl font-bold mb-8">Admin Panel</h2>
            <ul>
                <li class="mb-4"><a href="quanLyHoatDong.html" class="hover:text-yellow-400">Quản lý Hoạt động</a></li>
                <li class="mb-4 font-bold text-yellow-400">Quản lý Tin tức</li>
                <a href="index.html" class="block py-2 px-4 hover:bg-gray-800 rounded text-red-300">Về trang ADMIN </a>
            </ul>
        </div>

        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm p-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-700">Quản Lý Tin Tức & Thông Báo</h2>
                <button onclick="openModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 shadow font-bold">
                    <i class="fas fa-plus mr-2"></i> Viết bài mới
                </button>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <table class="min-w-full leading-normal">
                        <thead class="bg-gray-50 border-b-2 border-gray-200">
                            <tr>
                                <th class="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Hình ảnh</th>
                                <th class="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Tiêu đề / Tóm tắt</th>
                                <th class="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Ngày đăng</th>
                                <th class="px-5 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="newsTableBody">
                            </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div id="newsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden">
            <div class="bg-blue-900 px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg">Soạn Thảo Tin Tức</h3>
                <button onclick="closeModal()" class="hover:text-gray-300"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tiêu đề bài viết *</label>
                    <input type="text" id="txtTieuDe" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập tiêu đề...">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tóm tắt ngắn</label>
                    <textarea id="txtTomTat" rows="2" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Mô tả ngắn gọn..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Ảnh bìa</label>
                    <input type="file" id="fileAnh" class="w-full border p-1 rounded" accept="image/*">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nội dung chi tiết</label>
                    <textarea id="txtNoiDung" rows="6" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Viết nội dung vào đây..."></textarea>
                </div>
            </div>

            <div class="bg-gray-100 px-6 py-4 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-200">Hủy</button>
                <button onclick="saveNews()" class="px-6 py-2 bg-blue-900 text-white rounded font-bold hover:bg-blue-800">ĐĂNG BÀI</button>
            </div>
        </div>
    </div>

    <script src="../js/admin_quanLyTinTuc.js"></script>
</body>
</html>
