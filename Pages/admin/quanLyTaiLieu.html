<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Tài Liệu - Admin HUTECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-gradient-to-b from-blue-900 to-purple-900 text-white flex flex-col shadow-2xl transition-all duration-300 z-20">
            <div class="h-16 flex items-center justify-center border-b border-white/10 shadow-sm">
                <div class="flex items-center gap-2">
                    <i class="fas fa-shield-alt text-yellow-400 text-2xl"></i>
                    <span class="text-lg font-bold tracking-wide uppercase">QUẢN TRỊ VIÊN</span>
                </div>
            </div>
            <nav class="flex-grow py-6 space-y-1 px-3 overflow-y-auto scrollbar-thin">
                <a href="index.html" class="flex items-center px-4 py-3 hover:bg-white/10 rounded-lg text-gray-300 hover:text-white"><i class="fas fa-tachometer-alt w-6 mr-3"></i> Dashboard</a>
                <a href="quanLyHoatDong.html" class="flex items-center px-4 py-3 hover:bg-white/10 rounded-lg text-gray-300 hover:text-white"><i class="fas fa-calendar-alt w-6 mr-3"></i> Quản lý Hoạt động</a>
                <a href="quanLyTaiLieu.html" class="flex items-center px-4 py-3 bg-white/10 text-yellow-300 rounded-lg border-l-4 border-yellow-400 font-medium"><i class="fas fa-folder-open w-6 mr-3"></i> Kho Tài Liệu</a>
                <a href="index.html" class="block py-2 px-4 hover:bg-gray-800 rounded text-red-300">Về trang ADMIN </a>
            </nav>
        </aside>

        <div class="flex-grow flex flex-col h-screen overflow-y-auto bg-gray-50">
            <header class="bg-white h-16 shadow-sm flex justify-between items-center px-6 sticky top-0 z-10">
                <h2 class="text-xl font-bold text-blue-900 uppercase">Quản Lý Kho Tài Liệu</h2>
                <div class="flex items-center gap-3">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" class="w-10 h-10 rounded-full border border-gray-200">
                </div>
            </header>

            <main class="p-6 max-w-6xl mx-auto w-full">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
                    <h3 class="font-bold text-gray-800 text-lg mb-4">Tải lên tài liệu mới</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2 space-y-4">
                            <input type="text" id="txtName" class="w-full border p-2.5 rounded-lg" placeholder="Tên tài liệu...">
                            <div class="grid grid-cols-2 gap-4">
                                <select id="txtType" class="w-full border p-2.5 rounded-lg bg-white">
                                    <option value="Biểu mẫu">📝 Biểu mẫu</option>
                                    <option value="Quyết định">⚖️ Quyết định</option>
                                    <option value="Thông báo">📢 Thông báo</option>
                                    <option value="Khác">📂 Khác</option>
                                </select>
                                <input type="text" id="txtDesc" class="w-full border p-2.5 rounded-lg" placeholder="Mô tả ngắn...">
                            </div>
                        </div>
                        <div class="md:col-span-1">
                            <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-blue-300 rounded-lg cursor-pointer bg-blue-50 hover:bg-blue-100">
                                <i class="fas fa-file-import text-3xl text-blue-500 mb-2"></i>
                                <p id="fileNameDisplay" class="text-xs text-blue-600 font-bold">Click chọn file</p>
                                <input type="file" id="fileInput" class="hidden" onchange="displayFileName(this)">
                            </label>
                            <button onclick="uploadDoc()" class="w-full mt-4 bg-blue-900 text-white font-bold py-2.5 rounded-lg hover:bg-blue-800">
                                <i class="fas fa-upload"></i> Tải lên
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <h3 class="font-bold text-gray-800">Danh sách tài liệu</h3>
                        
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full font-bold" id="docCount">0 tài liệu</span>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-gray-600">
                            <thead class="bg-gray-50 text-gray-700 uppercase font-bold text-xs border-b">
                                <tr>
                                    <th class="px-6 py-3">#</th>
                                    <th class="px-6 py-3">Tên tài liệu</th>
                                    <th class="px-6 py-3">Loại</th>
                                    <th class="px-6 py-3">Ngày đăng</th>
                                    <th class="px-6 py-3 text-center">Thao tác</th>
                                </tr>
                            </thead>
                            
                            <tbody id="docTableBody">
                                <tr><td colspan="5" class="text-center py-8">Đang tải...</td></tr>
                            </tbody>
                            
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/admin_quanLyTaiLieu.js"></script>
</body>
</html>
