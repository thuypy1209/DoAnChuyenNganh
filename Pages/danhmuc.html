<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh mục - Quản lý Đoàn viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-8">
        <div class="bg-blue-900 text-white p-8 rounded-lg shadow-md mb-8">
            <h1 class="text-4xl font-bold">QUẢN LÝ DANH MỤC</h1>
            <p class="mt-2">Quản lý các danh mục chung của hệ thống như Chi đoàn, Khoa...</p>
        </div>

        <div class="flex justify-between items-center mb-6">
            <a href="#" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors flex items-center">
                <i class="fas fa-plus mr-2"></i> Thêm mới Danh mục
            </a>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-4 text-left font-semibold text-gray-600">ID</th>
                        <th class="p-4 text-left font-semibold text-gray-600">TÊN DANH MỤC</th>
                        <th class="p-4 text-left font-semibold text-gray-600">MÔ TẢ</th>
                        <th class="p-4 text-left font-semibold text-gray-600">HÀNH ĐỘNG</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr>
                        <td class="p-4">1</td>
                        <td class="p-4 font-medium text-gray-800">Chi đoàn 22DTHC1</td>
                        <td class="p-4 text-gray-600">Chi đoàn lớp Công nghệ phần mềm khóa 2022</td>
                        <td class="p-4 flex space-x-2">
                            <a href="#" class="text-blue-500 hover:text-blue-700" title="Sửa"><i class="fas fa-edit text-lg"></i></a>
                            <a href="#" class="text-red-500 hover:text-red-700" title="Xóa"><i class="fas fa-trash-alt text-lg"></i></a>
                        </td>
                    </tr>
                     <tr>
                        <td class="p-4">2</td>
                        <td class="p-4 font-medium text-gray-800">Khoa Công nghệ thông tin</td>
                        <td class="p-4 text-gray-600">Danh mục Khoa/Viện trong trường</td>
                        <td class="p-4 flex space-x-2">
                            <a href="#" class="text-blue-500 hover:text-blue-700" title="Sửa"><i class="fas fa-edit text-lg"></i></a>
                            <a href="#" class="text-red-500 hover:text-red-700" title="Xóa"><i class="fas fa-trash-alt text-lg"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/main.js"></script>
</body>
</html>
