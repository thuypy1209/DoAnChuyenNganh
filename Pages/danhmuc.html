<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh mục</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .hutech-font-title {
            font-family: 'Montserrat', sans-serif; 
        }
        .hutech-font-body {
            font-family: 'Open Sans', sans-serif;
        }
        /* Custom styles for consistency */
        .card-base {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .primary-button {
            background-color: #0D9488; /* teal-600 */
            color: white;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s ease-in-out;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        .primary-button:hover {
            background-color: #0F766E; /* teal-700 */
        }
        /* Style cho các card danh mục */
        .category-card {
            background-color: #f8fafc; /* blue-50 */
            border: 1px solid #e2e8f0; /* gray-200 */
            border-left: 5px solid #0D9488; /* teal-600 border */
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="flex h-screen hutech-font-body bg-gray-100">
    <div id="sidebar"></div>
    <div class="flex-1 flex flex-col">
        <div id="header"></div>
        <main class="flex-1 p-6 overflow-y-auto">
            <div class="card-base mb-6">
                <div class="bg-gradient-to-r from-teal-600 to-cyan-700 text-white p-8 rounded-lg shadow-xl text-center mb-6">
                    <h1 class="text-4xl font-extrabold mb-2 hutech-font-title">QUẢN LÝ DANH MỤC</h1>
                    <p class="text-lg opacity-90 hutech-font-body">Tạo và quản lý các loại danh mục, phân loại khác nhau trong hệ thống.</p>
                </div>
                <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
                    <button class="primary-button flex items-center" onclick="addNewDanhMuc()">
                        <i class="fas fa-folder-plus mr-2"></i> Thêm mới Danh mục
                    </button>
                    <div class="flex items-center space-x-2">
                        <label for="itemsPerPage" class="text-gray-700 hutech-font-body">Hiển thị</label>
                        <select id="itemsPerPage" class="border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-teal-500 text-gray-700 hutech-font-body">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                        </select>
                        <span class="text-gray-700 hutech-font-body">dòng</span>
                    </div>
                    <div class="relative">
                        <input type="text" placeholder="Tìm kiếm danh mục..." class="border border-gray-300 rounded-lg p-2 pl-10 focus:outline-none focus:ring-2 focus:ring-teal-500 text-gray-800 hutech-font-body">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
            </div>

            <div id="danhMucListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mt-6">
                <div class="category-card">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2 hutech-font-title">Danh mục mẫu 1</h3>
                        <p class="text-gray-600 text-sm hutech-font-body">Mô tả ngắn gọn về danh mục này.</p>
                    </div>
                    <div class="flex justify-end space-x-2 mt-4">
                        <button class="text-blue-600 hover:text-blue-800" onclick="editDanhMuc(1)"><i class="fas fa-edit"></i> Sửa</button>
                        <button class="text-red-600 hover:text-red-800" onclick="deleteDanhMuc(1)"><i class="fas fa-trash-alt"></i> Xóa</button>
                    </div>
                </div>
                <div class="category-card">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2 hutech-font-title">Danh mục mẫu 2</h3>
                        <p class="text-gray-600 text-sm hutech-font-body">Mô tả ngắn gọn về danh mục này.</p>
                    </div>
                    <div class="flex justify-end space-x-2 mt-4">
                        <button class="text-blue-600 hover:text-blue-800" onclick="editDanhMuc(2)"><i class="fas fa-edit"></i> Sửa</button>
                        <button class="text-red-600 hover:text-red-800" onclick="deleteDanhMuc(2)"><i class="fas fa-trash-alt"></i> Xóa</button>
                    </div>
                </div>
            </div>

            <nav class="flex items-center justify-between pt-4">
                <div class="text-sm text-gray-700 hutech-font-body">
                    Hiển thị <span class="font-medium">0</span> đến <span class="font-medium">0</span> trong <span class="font-medium">0</span> dòng
                </div>
                <div class="flex space-x-1">
                    <button class="px-3 py-1 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-200 transition-colors duration-200 hutech-font-body">Trước</button>
                    <button class="px-3 py-1 border border-blue-600 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200 hutech-font-body">1</button>
                    <button class="px-3 py-1 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-200 transition-colors duration-200 hutech-font-body">Sau</button>
                </div>
            </nav>
        </main>
        <div id="footer"></div>
    </div>
    <div id="danhMucModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md relative">
            <h2 id="danhMucModalTitle" class="text-2xl font-bold mb-6 text-gray-800 hutech-font-title">Thêm Danh mục mới</h2>
            
            <button class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 text-3xl" onclick="closeDanhMucModal()">
                &times;
            </button>

            <form id="danhMucForm" class="space-y-4">
                <input type="hidden" id="danhMucId"> 
                <div>
                    <label for="tenDanhMuc" class="block text-sm font-medium text-gray-700 hutech-font-body">Tên danh mục</label>
                    <input type="text" id="tenDanhMuc" name="tenDanhMuc" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body" required>
                </div>
                <div>
                    <label for="moTa" class="block text-sm font-medium text-gray-700 hutech-font-body">Mô tả</label>
                    <textarea id="moTa" name="moTa" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body"></textarea>
                </div>
                
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeDanhMucModal()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 transition-colors duration-200 hutech-font-body">Hủy</button>
                    <button type="submit" form="danhMucForm" class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors duration-200 shadow-md hutech-font-body">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/globalConfig.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/danhMuc.js"></script>
    <script src="js/header.js"></script>
</body>
</html>
