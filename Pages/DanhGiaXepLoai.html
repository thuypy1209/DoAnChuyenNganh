<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghiệp vụ: Đánh giá, Xếp loại</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* Tùy chỉnh nhỏ để textarea vừa vặn trong ô table */
        td textarea {
            width: 100%;
            height: 100%;
            padding: 8px;
            border: 1px solid transparent;
            border-radius: 4px;
            resize: vertical; /* Cho phép thay đổi chiều cao */
        }
        td textarea:focus {
            outline: none;
            border-color: #3b82f6; /* Màu xanh khi focus */
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-8">

        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Đánh giá đoàn viên</h1>
            <div class="flex items-center space-x-2">
                <label for="filter-year" class="font-medium">Năm:</label>
                <select id="filter-year" class="border border-gray-300 rounded-md p-2">
                    <option>2025</option>
                    <option>2024</option>
                    <option selected>2023</option>
                </select>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <div class="flex-grow max-w-sm">
                    <div class="relative">
                        <input type="text" placeholder="Tìm kiếm đoàn viên..." class="w-full border border-gray-300 rounded-md p-2 pl-10">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button class="bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 flex items-center">
                        <i class="fas fa-paper-plane mr-2"></i> GỬI
                    </button>
                    <button class="bg-gray-700 text-white font-bold py-2 px-4 rounded-lg hover:bg-gray-800 flex items-center">
                        <i class="fas fa-save mr-2"></i> LƯU
                    </button>
                    <button class="bg-green-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-600 flex items-center">
                        <i class="fas fa-file-excel mr-2"></i> XUẤT EXCEL
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full min-w-[1000px]">
                    <thead>
                        <tr class="bg-gray-50">
                            <th class="p-3 w-12 text-left font-semibold text-gray-600">STT</th>
                            <th class="p-3 w-48 text-left font-semibold text-gray-600">Họ tên</th>
                            <th class="p-3 text-left font-semibold text-gray-600">Ưu điểm</th>
                            <th class="p-3 text-left font-semibold text-gray-600">Khuyết điểm</th>
                            <th class="p-3 text-left font-semibold text-gray-600">Khen thưởng</th>
                            <th class="p-3 text-left font-semibold text-gray-600">Kỷ luật</th>
                            <th class="p-3 w-48 text-left font-semibold text-gray-600">Đánh giá</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        <tr>
                            <td class="p-1 align-top">1</td>
                            <td class="p-1 align-top font-medium">Nguyễn Ư</td>
                            <td class="p-0"><textarea rows="2" placeholder="/"></textarea></td>
                            <td class="p-0"><textarea rows="2" placeholder="/"></textarea></td>
                            <td class="p-0"><textarea rows="2" placeholder="/"></textarea></td>
                            <td class="p-0"><textarea rows="2" placeholder="/"></textarea></td>
                            <td class="p-1 align-top">
                                <select class="w-full border border-gray-300 rounded-md p-2">
                                    <option>Chưa đánh giá</option>
                                    <option>Xuất sắc</option>
                                    <option>Khá</option>
                                    <option>Trung bình</option>
                                    <option>Yếu kém</option>
                                </select>
                            </td>
                        </tr>
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/main.js"></script>
    <script src="/js/danhGiaXepLoai.js"></script> 
</body>
</html>
