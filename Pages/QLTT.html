<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Tin tức - Quản lý Đoàn viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-8">

        <div class="bg-blue-900 text-white p-8 rounded-lg shadow-md mb-8">
            <h1 class="text-4xl font-bold">QUẢN LÝ TIN TỨC</h1>
            <p class="mt-2">Theo dõi, thêm mới và chỉnh sửa thông tin tin tức một cách dễ dàng.</p>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <div class="flex items-center space-x-4">
                <a href="#" class="bg-blue-900 text-white font-bold py-2 px-4 rounded-lg hover:bg-teal-600 transition-colors flex items-center">
                    <i class="fas fa-plus mr-2"></i> Thêm mới
                </a>
                <div class="flex items-center">
                    <span>Hiển thị</span>
                    <select class="mx-2 border border-gray-300 rounded-md p-1">
                        <option>10</option>
                        <option>25</option>
                        <option>50</option>
                    </select>
                    <span>dòng</span>
                </div>
            </div>
            <div class="relative mt-4 md:mt-0">
                <input type="text" placeholder="Tìm kiếm tin tức..." class="border border-gray-300 rounded-lg py-2 pl-10 pr-4 focus:outline-none focus:border-teal-500">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-4 text-left font-semibold text-gray-600">STT</th>
                        <th class="p-4 text-left font-semibold text-gray-600">TIÊU ĐỀ</th>
                        <th class="p-4 text-left font-semibold text-gray-600">TÁC GIẢ</th>
                        <th class="p-4 text-left font-semibold text-gray-600">NGÀY ĐĂNG</th>
                        <th class="p-4 text-left font-semibold text-gray-600">HÌNH ẢNH</th>
                        <th class="p-4 text-left font-semibold text-gray-600">HÀNH ĐỘNG</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr>
                        <td class="p-4">1</td>
                        <td class="p-4 font-medium text-gray-800">Chào đón tân sinh viên 2025</td>
                        <td class="p-4 text-gray-600">Việt Lương</td>
                        <td class="p-4 text-gray-600">01/10/2025</td>
                        <td class="p-4"><img src="images/tin-tuc-phu.jpg" alt="thumbnail" class="h-10 w-16 object-cover rounded"></td>
                        <td class="p-4 flex space-x-2">
                            <a href="#" class="text-blue-500 hover:text-blue-700" title="Sửa"><i class="fas fa-edit text-lg"></i></a>
                            <a href="#" class="text-red-500 hover:text-red-700" title="Xóa"><i class="fas fa-trash-alt text-lg"></i></a>
                        </td>
                    </tr>
                    <tr>
                        <td class="p-4">2</td>
                        <td class="p-4 font-medium text-gray-800">Hội thảo "Học tập hiệu quả"</td>
                        <td class="p-4 text-gray-600">Tấn Cường</td>
                        <td class="p-4 text-gray-600">30/09/2025</td>
                        <td class="p-4"><img src="images/tin-tuc-phu2.jpg" alt="thumbnail" class="h-10 w-16 object-cover rounded"></td>
                        <td class="p-4 flex space-x-2">
                            <a href="#" class="text-blue-500 hover:text-blue-700" title="Sửa"><i class="fas fa-edit text-lg"></i></a>
                            <a href="#" class="text-red-500 hover:text-red-700" title="Xóa"><i class="fas fa-trash-alt text-lg"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
    

</body>
</html>
