<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê công tác Đoàn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-8">

        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Thống kê công tác đoàn</h1>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-md mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 items-end">
                
                <div class="col-span-1">
                    <label for="filter-chi-doan" class="block text-sm font-medium text-gray-700">Chi đoàn</label>
                    <select id="filter-chi-doan" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                        <option>Chi đoàn demo 3.1</option>
                        </select>
                </div>

                <div class="col-span-1">
                    <label for="filter-start-date" class="block text-sm font-medium text-gray-700">Từ ngày</label>
                    <input type="date" id="filter-start-date" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>

                <div class="col-span-1">
                    <label for="filter-end-date" class="block text-sm font-medium text-gray-700">Đến ngày</label>
                    <input type="date" id="filter-end-date" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                
                <div class="col-span-1 lg:col-span-2 flex space-x-2">
                    <button id="btn-view-stats" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 flex items-center justify-center">
                        <i class="fas fa-search mr-2"></i> Xem
                    </button>
                    <button id="btn-export-excel" class="w-full bg-green-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-600 flex items-center justify-center">
                        <i class="fas fa-file-excel mr-2"></i> Xuất Excel
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full whitespace-nowrap">
                    <thead class="bg-gray-100">
                        <tr>
                            <th rowspan="2" class="p-4 text-left font-semibold text-gray-600">STT</th>
                            <th rowspan="2" class="p-4 text-left font-semibold text-gray-600">Tên tổ chức</th>
                            <th colspan="3" class="p-4 text-center font-semibold text-gray-600 border-b">Số đoàn viên</th>
                            <th rowspan="2" class="p-4 text-left font-semibold text-gray-600">Chi tiết các biến động</th>
                        </tr>
                        <tr>
                            <th class="p-2 text-center font-medium text-gray-500 bg-gray-50">Tổng</th>
                            <th class="p-2 text-center font-medium text-gray-500 bg-gray-50">Nam</th>
                            <th class="p-2 text-center font-medium text-gray-500 bg-gray-50">Nữ</th>
                        </tr>
                    </thead>
                    <tbody id="statistics-table-body" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-gray-500">Vui lòng chọn điều kiện lọc và nhấn "Xem" để có kết quả.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/main.js"></script>
    <script src="/js/thongKeBienDong.js"></script> 
</body>
</html>
