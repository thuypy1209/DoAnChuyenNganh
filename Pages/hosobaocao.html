<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Hồ sơ - Quản lý Đoàn viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-8">
        <div class="bg-blue-900 text-white p-8 rounded-lg shadow-md mb-8">
            <h1 class="text-4xl font-bold">QUẢN LÝ HỒ SƠ & BÁO CÁO</h1>
            <p class="mt-2">Tải lên và quản lý các tài liệu, văn bản quan trọng.</p>
        </div>

        <div class="flex justify-between items-center mb-6">
            <a href="#" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors flex items-center">
                <i class="fas fa-upload mr-2"></i> Tải lên File
            </a>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-4 text-left font-semibold text-gray-600">TÊN FILE</th>
                        <th class="p-4 text-left font-semibold text-gray-600">NGÀY TẢI LÊN</th>
                        <th class="p-4 text-left font-semibold text-gray-600">KÍCH THƯỚC</th>
                        <th class="p-4 text-left font-semibold text-gray-600">HÀNH ĐỘNG</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr>
                        <td class="p-4 font-medium text-gray-800 flex items-center">
                            <i class="fas fa-file-pdf text-red-500 mr-3 text-xl"></i>
                            Bao_cao_tong_ket_2025.pdf
                        </td>
                        <td class="p-4 text-gray-600">01/10/2025</td>
                        <td class="p-4 text-gray-600">1.2 MB</td>
                        <td class="p-4 flex space-x-2">
                            <a href="#" class="text-green-500 hover:text-green-700" title="Tải về"><i class="fas fa-download text-lg"></i></a>
                            <a href="#" class="text-red-500 hover:text-red-700" title="Xóa"><i class="fas fa-trash-alt text-lg"></i></a>
                        </td>
                    </tr>
                    <tr>
                        <td class="p-4 font-medium text-gray-800 flex items-center">
                             <i class="fas fa-file-word text-blue-500 mr-3 text-xl"></i>
                            Danh_sach_doan_vien_xuat_sac.docx
                        </td>
                        <td class="p-4 text-gray-600">30/09/2025</td>
                        <td class="p-4 text-gray-600">256 KB</td>
                        <td class="p-4 flex space-x-2">
                            <a href="#" class="text-green-500 hover:text-green-700" title="Tải về"><i class="fas fa-download text-lg"></i></a>
                            <a href="#" class="text-red-500 hover:text-red-700" title="Xóa"><i class="fas fa-trash-alt text-lg"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/main.js"></script>
</body>
</html>
