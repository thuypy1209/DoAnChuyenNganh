<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Tin Tức - HUTECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans flex flex-col min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8 pt-24 flex-grow max-w-4xl">
        
        <a href="javascript:history.back()" class="inline-flex items-center text-gray-500 hover:text-blue-900 mb-6 transition-colors">
            <i class="fas fa-arrow-left mr-2"></i> Quay lại
        </a>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden min-h-[400px]">
            
            <div class="relative h-64 md:h-80 w-full">
                <img id="newsImage" src="images/banner1.jpg" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
            </div>

            <div class="p-8">
                <div class="flex items-center gap-4 text-sm text-gray-500 mb-4">
                    <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-bold text-xs uppercase">Tin tức</span>
                    <span class="flex items-center"><i class="far fa-calendar-alt mr-2"></i> <span id="newsDate">--/--/----</span></span>
                </div>

                <h1 id="newsTitle" class="text-3xl md:text-4xl font-bold text-gray-900 mb-6 leading-tight">
                    Đang tải tiêu đề...
                </h1>

                <div id="newsContent" class="prose max-w-none text-gray-700 leading-relaxed text-lg">
                    <p class="text-center text-gray-400">Đang tải nội dung...</p>
                </div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
    <script src="js/tinTucChiTiet.js"></script> 
</body>
</html>
