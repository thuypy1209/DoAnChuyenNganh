<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu & Hồ Sơ - HUTECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .active-tab { background-color: #1e3a8a; color: white; border-color: #1e3a8a; }
        .doc-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50 font-sans flex flex-col min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8 pt-24 flex-grow max-w-6xl">
        
        <h1 class="text-3xl font-bold text-blue-900 uppercase text-center mb-2">Cổng Thông Tin & Hồ Sơ</h1>
        <p class="text-center text-gray-500 mb-8">Tra cứu biểu mẫu và nộp hồ sơ trực tuyến.</p>

        <div class="flex justify-center mb-8 border-b border-gray-200">
            <button onclick="switchTab('download')" id="tabDownload" class="active-tab px-6 py-3 rounded-t-lg font-bold transition-all border-b-2 border-transparent">
                <i class="fas fa-cloud-download-alt mr-2"></i> Kho Tài Liệu
            </button>
            <button onclick="switchTab('upload')" id="tabUpload" class="px-6 py-3 rounded-t-lg font-bold text-gray-500 hover:text-blue-900 transition-all border-b-2 border-transparent">
                <i class="fas fa-file-upload mr-2"></i> Nộp Hồ Sơ
            </button>
        </div>

        <div id="panelDownload">
            <div class="flex justify-center gap-3 mb-6">
                <button onclick="filterDocs('all')" class="filter-btn px-4 py-1.5 bg-blue-100 text-blue-800 rounded-full text-sm font-bold hover:bg-blue-200 ring-2 ring-blue-300">Tất cả</button>
                <button onclick="filterDocs('Biểu mẫu')" class="filter-btn px-4 py-1.5 bg-white text-gray-600 border rounded-full text-sm font-bold hover:bg-gray-50">Biểu mẫu</button>
                <button onclick="filterDocs('Quyết định')" class="filter-btn px-4 py-1.5 bg-white text-gray-600 border rounded-full text-sm font-bold hover:bg-gray-50">Quyết định</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="studentDocList"></div>
        </div>

        <div id="panelUpload" class="hidden">
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded-r flex justify-between items-center">
                <div>
                    <p class="font-bold text-yellow-800"><i class="fas fa-exclamation-triangle mr-2"></i> Lưu ý:</p>
                    <p class="text-sm text-yellow-700">Vui lòng scan hoặc chụp ảnh rõ nét. File hỗ trợ: PDF, JPG, PNG.</p>
                </div>
                <button onclick="cleanUpData()" class="text-xs text-red-400 hover:text-red-600 underline">Reset dữ liệu rác</button>
            </div>

            <div class="space-y-4" id="requestList">
                <div class="text-center py-10"><i class="fas fa-spinner fa-spin"></i> Đang tải yêu cầu...</div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>
    <script src="js/main.js"></script>
    
    <script src="js/khoTaiLieu.js"></script> 

</body>
</html>
