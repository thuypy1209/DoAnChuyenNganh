<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Hoạt Động - Sổ Tay Rèn Luyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans flex flex-col min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8 pt-24 flex-grow">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-900 uppercase border-l-4 border-yellow-500 pl-3">Cổng Đăng Ký Hoạt Động</h1>
                <p class="text-gray-500 mt-1 ml-4">Tìm kiếm và tham gia các hoạt động để tích lũy điểm rèn luyện.</p>
            </div>
            <div class="flex gap-2">
                <a href="hoatDongCuaToi.html" class="bg-white border border-blue-900 text-blue-900 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50">
                    <i class="fas fa-history mr-2"></i> Hoạt động của tôi
                </a>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-8">
            
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="flex-grow relative">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Tìm tên hoạt động..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <select class="p-2 border rounded-lg text-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">-- Tất cả các Khoa --</option>
                    <option value="CNTT">Khoa CNTT</option>
                    <option value="QTKD">Khoa Quản trị kinh doanh</option>
                </select>
                <select class="p-2 border rounded-lg text-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">-- Loại hoạt động --</option>
                    <option value="Tình nguyện">Tình nguyện</option>
                    <option value="Học thuật">Học thuật</option>
                    <option value="Văn nghệ">Văn nghệ - Thể thao</option>
                </select>
                <button id="btnFilter" class="bg-blue-900 text-white px-6 py-2 rounded-lg hover:bg-blue-800 font-bold">Lọc</button>
            </div>

            <div class="flex border-b border-gray-200">
                <button class="tab-btn px-6 py-3 font-bold text-blue-900 border-b-2 border-blue-900 focus:outline-none transition-colors" data-tab="DangMo">
                    <i class="fas fa-lock-open mr-2"></i> Đang mở đăng ký
                </button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-500 hover:text-blue-700 focus:outline-none transition-colors" data-tab="SapDienRa">
                    <i class="fas fa-clock mr-2"></i> Sắp diễn ra
                </button>
                <button class="tab-btn px-6 py-3 font-medium text-gray-500 hover:text-blue-700 focus:outline-none transition-colors" data-tab="DaKetThuc">
                    <i class="fas fa-check-circle mr-2"></i> Đã kết thúc
                </button>
            </div>
        </div>

        <div id="activitiesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-10 text-gray-500">Đang tải dữ liệu...</div>
        </div>

    </main>

    <div id="registerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-95 opacity-0" id="modalContent">
            <div class="bg-blue-900 px-6 py-4 flex justify-between items-center">
                <h3 class="text-white font-bold text-lg">Xác nhận đăng ký</h3>
                <button id="closeModal" class="text-white hover:text-gray-300"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hoạt động:</label>
                    <p id="modalActivityName" class="font-bold text-blue-900 text-lg">Mùa Hè Xanh 2025</p>
                    <input type="hidden" id="modalActivityId">
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Họ tên:</label>
                        <input type="text" id="modalStudentName" class="w-full border-gray-300 bg-gray-100 rounded-md p-2 text-sm" value="Lương Quốc Việt" readonly>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">MSSV:</label>
                        <input type="text" id="modalMssv" class="w-full border-gray-300 bg-gray-100 rounded-md p-2 text-sm" value="2280603664" readonly>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Minh chứng (Nếu có):</label>
                    
                    <div onclick="document.getElementById('fileMinhChung').click()" class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center cursor-pointer hover:bg-gray-50 transition-colors relative">
                        
                        <input type="file" id="fileMinhChung" class="hidden" accept="image/*" onchange="previewMinhChung(this)">
                        
                        <div id="iconUploadPlaceholder">
                            <i class="fas fa-cloud-upload-alt text-gray-400 text-2xl mb-2"></i>
                            <p class="text-xs text-gray-500">Bấm để chọn ảnh thẻ SV hoặc CMND</p>
                        </div>

                        <img id="imgMinhChungPreview" class="hidden max-h-40 mx-auto rounded shadow-sm object-contain">
                    </div>
                </div>
                <div class="flex gap-3">
                    <button id="btnCancel" class="w-1/2 py-2 border border-gray-300 rounded-lg text-gray-600 font-bold hover:bg-gray-100">Hủy bỏ</button>
                    <button id="btnConfirm" class="w-1/2 py-2 bg-blue-900 text-white rounded-lg font-bold hover:bg-blue-800 shadow-lg">GỬI ĐĂNG KÝ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>
    <script src="js/dangKyHoatDong.js"></script> 
</body>
</html>
