<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê Ban Chấp hành Đoàn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-8">

        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Thống kê ban chấp hành đoàn</h1>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-md mb-6 flex items-center space-x-4">
            <div class="flex-grow">
                <label for="filter-chi-doan-bch" class="block text-sm font-medium text-gray-700">Chi đoàn</label>
                <select id="filter-chi-doan-bch" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    <option>Chi đoàn demo 3.1</option>
                    </select>
            </div>
            <button id="btn-view-bch" class="self-end bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700">
                Xem
            </button>
        </div>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full whitespace-nowrap">
                    <thead class="bg-blue-800 text-white">
                        <tr>
                            <th rowspan="2" class="p-4 text-left font-semibold">#</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Họ và Tên</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Chức vụ Đoàn</th>
                            <th colspan="2" class="p-4 text-center font-semibold border-l border-r border-blue-700">Ngày sinh</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Quê quán</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Dân tộc</th>
                            <th colspan="2" class="p-4 text-center font-semibold border-l border-r border-blue-700">Trình độ</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Ngày vào Đoàn</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Ngày vào Đảng</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Chức vụ Đảng</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Điện thoại</th>
                            <th rowspan="2" class="p-4 text-left font-semibold">Email</th>
                        </tr>
                        <tr>
                            <th class="py-2 px-4 text-center font-medium bg-blue-700 border-r border-blue-600">Nam</th>
                            <th class="py-2 px-4 text-center font-medium bg-blue-700">Nữ</th>
                            <th class="py-2 px-4 text-center font-medium bg-blue-700 border-r border-blue-600">Chuyên môn</th>
                            <th class="py-2 px-4 text-center font-medium bg-blue-700">Lý luận chính trị</th>
                        </tr>
                    </thead>
                    <tbody id="bch-table-body" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="14" class="p-8 text-center text-gray-500">Vui lòng chọn chi đoàn và nhấn "Xem".</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/main.js"></script>
    <script src="/js/banChapHanh.js"></script> 
</body>
</html>
