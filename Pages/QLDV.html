<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý Đoàn viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif; /* Font mặc định của bạn */
        }
        .hutech-font-title {
            font-family: 'Montserrat', sans-serif; 
        }
        .hutech-font-body {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>
<body class="flex h-screen hutech-font-body">
    <div id="sidebar"></div>
    <div class="flex-1 flex flex-col">
        <div id="header"></div>
        <main class="flex-1 p-6 overflow-y-auto bg-gray-100">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="bg-gradient-to-r from-teal-600 to-cyan-700 text-white p-8 rounded-lg shadow-xl text-center mb-6">
                    <h1 class="text-4xl font-extrabold mb-2 hutech-font-title">QUẢN LÝ ĐOÀN VIÊN</h1>
                    <p class="text-lg opacity-90 hutech-font-body">Theo dõi, thêm mới và chỉnh sửa thông tin đoàn viên một cách dễ dàng.</p>
                </div>
                <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
                    <button class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-lg flex items-center transition-colors duration-200 shadow-md" onclick="addNewDoanVien()">
                        <i class="fas fa-plus mr-2"></i> Thêm mới
                    </button>
                    <div class="flex items-center space-x-2">
                        <label for="itemsPerPage" class="text-gray-700 hutech-font-body">Hiển thị</label>
                        <select id="itemsPerPage" class="border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 hutech-font-body">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                        </select>
                        <span class="text-gray-700 hutech-font-body">dòng</span>
                    </div>
                    <div class="relative">
                        <input type="text" placeholder="Tìm kiếm..." class="border border-gray-300 rounded-lg p-2 pl-10 focus:outline-none focus:ring-2 focus:ring-teal-500 text-gray-800 hutech-font-body">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
            </div>
            <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-md mt-6"> <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-teal-700 text-white">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider rounded-tl-lg">STT</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Mã số sinh viên</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Họ và tên</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Ngày sinh</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Số điện thoại</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Email</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Khoa</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Ngành</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Khóa học</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Ngày tạo</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider rounded-tr-lg">Action</th>
                        </tr>
                    </thead>
                    <tbody id="doanVienTableBody" class="bg-white divide-y divide-gray-200"> </tbody>
                </table>
            </div>
            <nav class="flex items-center justify-between pt-4">
                <div class="text-sm text-gray-700 hutech-font-body">
                    Hiển thị <span class="font-medium">1</span> đến <span class="font-medium">1</span> trong <span class="font-medium">1</span> dòng
                </div>
                <div class="flex space-x-1">
                    <button class="px-3 py-1 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-200 transition-colors duration-200 hutech-font-body">Trước</button>
                    <button class="px-3 py-1 border border-blue-600 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200 hutech-font-body">1</button>
                    <button class="px-3 py-1 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-200 transition-colors duration-200 hutech-font-body">Sau</button>
                </div>
            </nav>
        </main>
        <div id="footer"></div>
    </div>
    <div id="doanVienModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md relative">
            <h2 id="modalTitle" class="text-2xl font-bold mb-6 text-gray-800 hutech-font-title">Thêm Đoàn viên Mới</h2>
            
            <button class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 text-3xl" onclick="closeModal()">
                &times;
            </button>

            <form id="doanVienForm" class="space-y-4">
                <input type="hidden" id="doanVienId"> 
                <div>
                    <label for="maDoanVien" class="block text-sm font-medium text-gray-700 hutech-font-body">Mã số sinh viên</label>
                    <input type="text" id="maDoanVien" name="maDoanVien" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body" required>
                </div>
                <div>
                    <label for="hoTen" class="block text-sm font-medium text-gray-700 hutech-font-body">Họ và Tên</label>
                    <input type="text" id="hoTen" name="hoTen" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body" required>
                </div>
                <div>
                    <label for="ngaySinh" class="block text-sm font-medium text-gray-700 hutech-font-body">Ngày sinh</label>
                    <input type="date" id="ngaySinh" name="ngaySinh" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body" required>
                </div>
                <div>
                    <label for="soDienThoai" class="block text-sm font-medium text-gray-700 hutech-font-body">Số điện thoại</label>
                    <input type="tel" id="soDienThoai" name="soDienThoai" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 hutech-font-body">Email</label>
                    <input type="email" id="email" name="email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body" required>
                </div>
                <div>
                    <label for="khoa" class="block text-sm font-medium text-gray-700 hutech-font-body">Khoa</label>
                    <input type="text" id="khoa" name="khoa" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body">
                </div>
                <div>
                    <label for="nganh" class="block text-sm font-medium text-gray-700 hutech-font-body">Ngành</label>
                    <input type="text" id="nganh" name="nganh" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body">
                </div>
                <div>
                    <label for="khoaHoc" class="block text-sm font-medium text-gray-700 hutech-font-body">Khóa học</label>
                    <input type="text" id="khoaHoc" name="khoaHoc" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-teal-500 focus:border-teal-500 text-gray-800 hutech-font-body">
                </div>
                
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 transition-colors duration-200 hutech-font-body">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors duration-200 shadow-md hutech-font-body">Lưu</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/globalConfig.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/doanvien.js"></script> 
    <script src="js/header.js"></script>
</body>
</html>
