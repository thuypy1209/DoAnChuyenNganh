<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
        }
        .change-container {
            max-width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .logo {
            width: 60px;
            margin-bottom: 10px;
        }
        .form-title {
            font-size: 22px;
            font-weight: bold;
            color: #0066cc;
        }
        .form-subtitle {
            font-size: 14px;
            color: #555;
        }
        .version {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="change-container">
        <div class="text-center">
            <img src="https://sinhvien2.hutech.edu.vn/assets/img/logo.png"
                 alt="HUTECH Logo" class="logo">
            <div class="form-title">HUTECH</div>
            <div class="form-subtitle">Đại học Công nghệ Tp.HCM</div>
            <p class="fw-bold mt-3">Đổi mật khẩu</p>
            <p class="text-muted small">Cập nhật mật khẩu mới để bảo mật tài khoản</p>
        </div>
        <form id="changeForm">
            <div class="mb-3">
                <input type="password" name="oldPassword" class="form-control" placeholder="Mật khẩu cũ" required>
            </div>
            <div class="mb-3">
                <input type="password" name="newPassword" class="form-control" placeholder="Mật khẩu mới" required>
            </div>
            <div class="mb-3">
                <input type="password" name="confirmNewPassword" class="form-control" placeholder="Xác nhận mật khẩu mới" required>
            </div>
            <div id="message" class="text-danger mb-2"></div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Cập nhật</button>
            </div>
        </form>
        <div class="version">
            Version 1.1.0<br>
            © 2025. Bản quyền của COSO
        </div>
        <p class="mt-3"><a href="../Home.html">Về trang chủ</a></p>
    </div>
</div>

<script src="../js/authen.js"></script>
</body>
</html>
