<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
        }
        .forgot-container {
            max-width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .logo {
            width: 60px;
            margin-bottom: 10px;
        }
        .form-title {
            font-size: 22px;
            font-weight: bold;
            color: #0066cc;
        }
        .form-subtitle {
            font-size: 14px;
            color: #555;
        }
        .version {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="forgot-container">
        <div class="text-center">
            <img src="https://sinhvien2.hutech.edu.vn/assets/img/logo.png"
                 alt="HUTECH Logo" class="logo">
            <div class="form-title">HUTECH</div>
            <div class="form-subtitle">Đại học Công nghệ Tp.HCM</div>
            <p class="fw-bold mt-3">Quên mật khẩu</p>
            <p class="text-muted small">Nhập email để nhận hướng dẫn đặt lại mật khẩu</p>
        </div>
        <form id="forgotForm">
            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email của bạn" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-warning">Gửi yêu cầu</button>
            </div>
        </form>
        <div class="version">
            Version 1.1.0<br>
            © 2025. Bản quyền của COSO
        </div>
        <p class="mt-3"><a href="login.html">Quay lại đăng nhập</a></p>
    </div>
</div>

<script>
    document.getElementById('forgotForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const email = this.email.value;

        fetch('http://localhost:5114/api/Account/forgotpassword', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message || 'Vui lòng kiểm tra email để đặt lại mật khẩu.');
        })
        .catch(error => {
            console.error('Lỗi:', error);
            alert('Đã xảy ra lỗi. Vui lòng thử lại.');
        });
    });
</script>
</body>
</html>
