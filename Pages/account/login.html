<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - HUTECH Sổ Tay Điện Tử</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-blue-600">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-800">HUTECH ADMIN</h1>
            <p class="text-gray-500 text-sm mt-1">Sổ tay Rèn luyện & Hoạt động</p>
        </div>

        <form id="loginForm">
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email nhà trường</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" 
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" 
                        placeholder="Ví dụ: viet.luong@hutech.edu.vn">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Mật khẩu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" 
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" 
                        placeholder="Nhập mật khẩu...">
                </div>
            </div>

            <button type="button" id="btnLogin" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition duration-200">
                Đăng Nhập
            </button>

            <div id="otpSection" class="hidden mt-6 pt-4 border-t border-gray-200 animate-fade-in-down">
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4">
                    <p class="text-sm text-yellow-700">
                        <i class="fa-solid fa-circle-info mr-1"></i>
                        Đã gửi mã OTP về email của bạn. Vui lòng kiểm tra và nhập vào bên dưới.
                    </p>
                </div>

                <label class="block text-gray-700 text-sm font-bold mb-2">Mã xác thực (OTP)</label>
                <input type="text" id="otpCode" 
                    class="w-full px-3 py-3 border border-gray-300 rounded-lg text-center text-xl tracking-widest font-mono focus:outline-none focus:border-green-500 mb-4" 
                    placeholder="######" maxlength="6">

                <button type="button" id="btnVerifyOtp" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition duration-200">
                    Xác Thực & Vào Hệ Thống <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>

        </form>
        
        <p class="text-center text-gray-400 text-xs mt-6">
            &copy; 2025 HUTECH - Đồ án Chuyên ngành CNTT
        </p>
    </div>

    <script src="../../js/globalConfig.js"></script>
    
    <script src="../../js/authen.js"></script>

    <style>
        .animate-fade-in-down {
            animation: fadeInDown 0.5s ease-out;
        }
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* Class ẩn của Tailwind đôi khi cần ép kiểu */
        .hidden { display: none !important; }
    </style>

</body>
</html>
