<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <style>
    body {
      background-color: #f9f9f9;
    }
    .login-container {
      max-width: 400px;
      margin: 50px auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .login-logo {
      width: 60px;
      margin-bottom: 10px;
    }
    .form-title {
      font-size: 22px;
      font-weight: bold;
      color: #0066cc;
    }
    .form-subtitle {
      font-size: 14px;
      color: #555;
    }
    .google-btn {
      border: 1px solid #ccc;
      background-color: #fff;
      width: 100%;
      padding: 10px;
      border-radius: 5px;
    }
    .divider {
      text-align: center;
      margin: 15px 0;
      color: #999;
      font-size: 13px;
    }
    .version {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      margin-top: 20px;
    }
  </style>
  </head>
  <body>
    <div class="container">
      <div class="login-container">
        <div class="text-center">
          <img src="https://sinhvien2.hutech.edu.vn/assets/img/logo.png"
            alt="HUTECH Logo" class="login-logo">
          <div class="form-title">HUTECH</div>
          <div class="form-subtitle">Đại học Công nghệ Tp.HCM</div>
          <p class="fw-bold mt-3">Cổng thông tin Đoàn viên</p>
          <p class="text-muted small">Chào mừng trở lại, Đăng nhập để tiếp tục
            truy cập</p>
        </div>

        <button class="google-btn mb-3">
          <img src="https://www.svgrepo.com/show/355037/google.svg"
            alt="Google icon" width="20" class="me-2">
          Đăng nhập bằng Google
        </button>

        <div class="divider">Hoặc, đăng nhập bằng phương thức khác</div>

        <form onsubmit="event.preventDefault(); login();">
          <div class="mb-3">
            <input type="text" class="form-control" id="username"
              placeholder="Tên đăng nhập" required>
          </div>
          <div class="mb-3 input-group">
            <input type="password" class="form-control" id="password"
              placeholder="Mật khẩu" required>
            <button class="btn btn-outline-secondary" type="button"
              onclick="togglePassword(event)">👁</button>
          </div>
          <div id="message" class="text-danger mb-3"></div>
          <div class="mb-2 text-end">
            <a href="account/changepassword.html" class="small">Quên mật
              khẩu?</a>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Đăng nhập</button>
          </div>
        </form>

        <div class="version">
          Version 1.1.0<br>
          © 2025. Bản quyền của COSO
        </div>

        <div class="text-center mt-2">
          <p class="small">Chưa có tài khoản? <a href="register.html">Đăng
              ký</a></p>
        </div>
      </div>
    </div>

    <!-- JS Logic -->
    <script src="../js/authen.js"></script>

  </body>
</html>
