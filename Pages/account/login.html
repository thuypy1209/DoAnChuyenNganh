<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - HUTECH Sổ Tay Điện Tử</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-4 border-blue-600">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-800">HUTECH ĐOÀN VIÊN</h1>
            <p class="text-gray-500 text-sm mt-1">Sổ tay Rèn luyện & Hoạt động</p>
        </div>

        <form id="loginForm">
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email nhà trường</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" 
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" 
                        placeholder="">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Mật khẩu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" 
                        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition" 
                        placeholder="Nhập mật khẩu...">
                </div>
            </div>

            <button type="button" id="btnLogin" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition duration-200">
                Đăng Nhập
            </button>

            <div class="my-4 flex items-center justify-between">
                <span class="border-b w-1/5 border-gray-300"></span>
                <span class="text-xs text-center text-gray-400 uppercase">Hoặc tiếp tục với</span>
                <span class="border-b w-1/5 border-gray-300"></span>
            </div>

            <button type="button" class="w-full border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 font-bold py-2.5 rounded-lg shadow-sm flex items-center justify-center transition duration-200">
                <i class="fa-brands fa-google text-red-500 mr-2 text-lg"></i>
                Google
            </button>
            <div class="my-3"></div>

            <button type="button" class="w-full border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 font-bold py-2.5 rounded-lg shadow-sm flex items-center justify-center transition duration-200">
                <i class="fa-brands fa-gmail text-red-500 mr-2 text-lg"></i>
                Gmail
            </button>
            
            </form>

        <div class="mt-6 text-center border-t pt-4">
            <p class="text-blue-600 text-sm">Bạn chưa có tài khoản?</p>
            <a href="register.html" class="text-blue-600 font-bold hover:underline mt-1 inline-block">
                Đăng ký thành viên mới
            </a>
        </div>
        
        <div class="mt-6 text-center border-t pt-4">
            <a href="../Home.html" class="text-blue-600 font-bold hover:underline mt-1 inline-block">
                Về Trang Chủ
            </a>
        </div>
    </div>

    

    <script src="../../js/globalConfig.js"></script>
    
    <script src="../../js/authen.js"></script>

    <style>
        .animate-fade-in-down {
            animation: fadeInDown 0.5s ease-out;
        }
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* Class ẩn của Tailwind đôi khi cần ép kiểu */
        .hidden { display: none !important; }
    </style>

    

</body>
</html>
