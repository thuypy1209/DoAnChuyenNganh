<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Đăng ký</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <style>
        body {
            background-color: #f9f9f9;
        }

        .register-container {
            max-width: 400px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .register-logo {
            width: 60px;
            margin-bottom: 10px;
        }

        .form-title {
            font-size: 22px;
            font-weight: bold;
            color: #0066cc;
        }

        .form-subtitle {
            font-size: 14px;
            color: #555;
        }

        .google-btn {
            border: 1px solid #ccc;
            background-color: #fff;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #999;
            font-size: 13px;
        }

        .version {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: 20px;
        }
    </style>
    </head>
    <body>
        <div class="container">
            <div class="register-container">
                <div class="text-center">
                    <img
                        src="https://sinhvien2.hutech.edu.vn/assets/img/logo.png"
                        alt="HUTECH Logo" class="register-logo">
                    <div class="form-title">HUTECH</div>
                    <div class="form-subtitle">Đại học Công nghệ Tp.HCM</div>
                    <p class="fw-bold mt-3">Tạo tài khoản Đoàn viên</p>
                    <p class="text-muted small">Điền thông tin bên dưới để đăng
                        ký</p>
                </div>
                <button class="google-btn mb-3">
                    <img src="https://www.svgrepo.com/show/355037/google.svg"
                        alt="Google icon" width="20" class="me-2">
                    Đăng ký bằng Google
                </button>
                <div class="divider">Hoặc, đăng ký bằng Email</div>
                <form id="registerForm">
                    <div class="mb-3">
                        <input type="text" name="fullName" class="form-control"
                            placeholder="Họ và tên" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" name="username" pattern="[a-zA-Z0-9]+" title="Chỉ dùng chữ cái hoặc số" class="form-control" placeholder="Tên đăng nhập" required>

                    </div>
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control"
                            placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" name="password"
                            class="form-control" placeholder="Mật khẩu"
                            required>
                    </div>
                    <div class="mb-3">
                        <input type="password" name="confirmPassword"
                            class="form-control" placeholder="Nhập lại mật khẩu"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Loại tài khoản:</label>
                        <select name="role" class="form-select" required>
                            <option value>-- Chọn loại tài khoản --</option>
                            <option value="admin">Admin</option>
                            <option value="Đoàn Trường">Đoàn Trường</option>
                            <option value="Đoàn Khoa">Đoàn Khoa</option>
                            <option value="Đoàn Viên">Đoàn Viên</option>
                        </select>
                    </div>
                    <div id="message" class="text-danger mb-3"></div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Đăng
                            ký</button>
                    </div>
                </form>
                <div class="version">
                    Version 1.1.0<br>
                    © 2025. Bản quyền của COSO
                </div>
                <p class="mt-3">Đã có tài khoản? <a href="login.html">Đăng
                        nhập</a></p>
                <p><a href="forgotpassword.html">Quên mật khẩu?</a></p>
            </div>
        </div>
        <script src="../js/authen.js"></script>
    </body>
</html>
