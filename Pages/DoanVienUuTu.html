<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nghiệp vụ: Đoàn viên Ưu tú</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-8">

        <div class="mb-6">
            <p class="text-sm text-gray-500">NGHIỆP VỤ QUẢN LÝ ĐOÀN VIÊN / ĐOÀN VIÊN ƯU TÚ</p>
            <h1 class="text-3xl font-bold text-gray-800">Đoàn viên ưu tú</h1>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="border-b border-gray-200 mb-4">
                <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                    <button data-content-id="content-xet-chon" class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm border-blue-500 text-blue-600">
                        Danh sách xét chọn đoàn viên ưu tú
                    </button>
                    <button data-content-id="content-da-chon" class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Danh sách đoàn viên ưu tú
                    </button>
                </nav>
            </div>

            <div id="content-xet-chon" class="tab-content">
                <div id="view-chon-dv-uutuu">
                    <div class="flex justify-end mb-4">
                        <button id="btn-show-xac-nhan-uutuu" class="bg-green-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-600">
                            <i class="fas fa-award mr-2"></i> XÉT ĐOÀN VIÊN ƯU TÚ
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="p-3 w-10"><input type="checkbox"></th>
                                    <th class="p-3 text-left font-semibold text-gray-600">Họ và tên</th>
                                    <th class="p-3 text-left font-semibold text-gray-600">Ngày sinh</th>
                                    <th class="p-3 text-left font-semibold text-gray-600">Xếp loại năm học</th>
                                    <th class="p-3 text-left font-semibold text-gray-600">Thành tích</th>
                                </tr>
                            </thead>
                            <tbody id="chon-dv-uutuu-table-body" class="divide-y">
                                <tr>
                                    <td class="p-3"><input type="checkbox" class="dv-uutuu-checkbox"></td>
                                    <td class="p-3">Nguyễn Văn Ưu Tú 1</td>
                                    <td class="p-3">01/01/2003</td>
                                    <td class="p-3">Xuất sắc</td>
                                    <td class="p-3">Giải nhất Olympic Tin học</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div id="view-xac-nhan-uutuu" class="hidden">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 space-y-4">
                            <div><label class="block text-sm font-medium">ĐOÀN CƠ SỞ ĐỀ NGHỊ</label><select class="mt-1 w-full p-2 border rounded-md"><option>Đoàn cơ sở demo 2</option></select></div>
                            <div><label class="block text-sm font-medium">NGÀY ĐỀ NGHỊ</label><input type="date" class="mt-1 w-full p-2 border rounded-md"></div>
                            <div><label class="block text-sm font-medium">NỘI DUNG</label><textarea rows="4" class="mt-1 w-full p-2 border rounded-md">Đề nghị xét công nhận đoàn viên ưu tú</textarea></div>
                        </div>
                        <div>
                            <h3 class="font-bold mb-2">DANH SÁCH XÉT CÔNG NHẬN</h3>
                            <div class="border rounded-md max-h-64 overflow-y-auto">
                                <table class="w-full">
                                    <thead><tr><th class="p-2 text-left">Stt</th><th class="p-2 text-left">Họ và tên</th><th class="p-2 text-left">Xóa</th></tr></thead>
                                    <tbody id="xac-nhan-uutuu-list-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="mt-8 flex justify-start space-x-2">
                        <button class="bg-green-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-600">CHUYỂN XỬ LÝ</button>
                        <button id="btn-quay-lai-uutuu" class="bg-gray-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-gray-600">QUAY LẠI</button>
                    </div>
                </div>
            </div>
            
            <div id="content-da-chon" class="tab-content hidden">
                 <p class="text-center p-8 text-gray-500">Giao diện danh sách các đoàn viên ưu tú đã được công nhận sẽ ở đây.</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/main.js"></script>
    <script src="/js/doanVienUuTu.js"></script> 
</body>
</html>
