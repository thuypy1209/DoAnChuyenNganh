<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Văn Bằng - HUTECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex flex-col min-h-screen items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-lg w-full border-t-8 border-blue-900 relative overflow-hidden">
        
        <img src="images/hutech_logo.png" class="absolute -right-10 -bottom-10 w-64 opacity-5">

        <div class="text-center mb-8">
            <img src="images/hutech_logo.png" class="h-16 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-blue-900 uppercase">Cổng Xác Thực Văn Bằng</h1>
            <p class="text-gray-500 text-sm">Hệ thống quản lý hoạt động sinh viên</p>
        </div>

        <div id="resultContainer" class="text-center">
            <i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i>
            <p class="mt-2 text-gray-600">Đang kiểm tra mã xác thực...</p>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Lấy mã từ URL (Ví dụ: xacThuc.html?code=CERT-2025-VIET-001)
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const container = document.getElementById('resultContainer');

            if (!code) {
                showError("Không tìm thấy mã xác thực.");
                return;
            }

            try {
                // Gọi API Tra cứu (Dùng chung API TraCuu hôm qua)
                const API_URL = `http://localhost:5114/api/ChungNhans/TraCuu?keyword=${code}`;
                const response = await fetch(API_URL);

                if (response.ok) {
                    const cert = await response.json();
                    showSuccess(cert);
                } else {
                    showError("Mã chứng nhận không tồn tại hoặc không hợp lệ.");
                }
            } catch (error) {
                showError("Lỗi kết nối hệ thống.");
            }

            function showSuccess(cert) {
                const date = new Date(cert.NgayCap);
                container.innerHTML = `
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
                        <i class="fas fa-check-circle text-green-600 text-5xl mb-2"></i>
                        <h2 class="text-xl font-bold text-green-800">CHỨNG NHẬN HỢP LỆ</h2>
                    </div>
                    
                    <div class="text-left space-y-3 text-gray-700 border-t border-gray-100 pt-4">
                        <p><span class="font-bold text-gray-500 w-24 inline-block">Cấp cho:</span> <span class="font-bold text-blue-900 text-lg uppercase">${cert.TenSinhVien}</span></p>
                        <p><span class="font-bold text-gray-500 w-24 inline-block">MSSV:</span> <span class="font-mono">${cert.MSSV}</span></p>
                        <p><span class="font-bold text-gray-500 w-24 inline-block">Hoạt động:</span> <b>${cert.TenHoatDong}</b></p>
                        <p><span class="font-bold text-gray-500 w-24 inline-block">Ngày cấp:</span> ${date.toLocaleDateString('vi-VN')}</p>
                        <p><span class="font-bold text-gray-500 w-24 inline-block">Số hiệu:</span> <span class="bg-gray-200 px-2 py-0.5 rounded text-xs font-mono">${cert.MaXacThuc}</span></p>
                    </div>

                    <div class="mt-6 text-xs text-gray-400 italic">
                        Xác nhận bởi: Đoàn trường Đại học Công nghệ TP.HCM (HUTECH)
                    </div>
                `;
            }

            function showError(msg) {
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-6">
                        <i class="fas fa-times-circle text-red-500 text-5xl mb-3"></i>
                        <h2 class="text-xl font-bold text-red-700 mb-1">KHÔNG HỢP LỆ</h2>
                        <p class="text-red-600">${msg}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
