<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoạt Động & Phong Trào - HUTECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        .date-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .date-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .gallery-item {
            overflow: hidden;
            cursor: pointer;
        }
        .gallery-item img {
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans flex flex-col min-h-screen">

    <div id="navbar-placeholder"></div>

    <main class="container mx-auto px-4 py-8 pt-24 flex-grow">

        <section class="mb-12">
            <div class="flex items-center mb-6">
                <div class="w-2 h-8 bg-red-600 mr-3"></div>
                <h2 class="text-2xl font-bold text-blue-900 uppercase">Phong Trào Trọng Điểm</h2>
            </div>

            <div class="swiper phongTraoSwiper rounded-2xl shadow-xl overflow-hidden">
                <div class="swiper-wrapper" id="featuredContainer">
                    <div class="swiper-slide relative h-[400px]">
                        <img src="images/banner1.jpg" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex items-end p-8">
                            <div class="text-white">
                                <span class="bg-red-600 px-3 py-1 rounded text-xs font-bold mb-2 inline-block">SỰ KIỆN LỚN</span>
                                <h3 class="text-3xl font-bold mb-2">Chiến dịch Mùa Hè Xanh 2025</h3>
                                <p class="text-gray-200 line-clamp-2 mb-4">Cùng sinh viên HUTECH mang sức trẻ đến những vùng đất mới, cống hiến và trưởng thành.</p>
                                <a href="dangKyHoatDong.html" class="bg-white text-blue-900 px-6 py-2 rounded-lg font-bold hover:bg-blue-50 transition-colors">
                                    <i class="fas fa-sign-in-alt mr-2"></i> Đăng ký ngay
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-next text-white"></div>
                <div class="swiper-button-prev text-white"></div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center">
                        <div class="w-2 h-8 bg-blue-600 mr-3"></div>
                        <h2 class="text-2xl font-bold text-blue-900 uppercase">Lịch Sự Kiện Sắp Tới</h2>
                    </div>
                    <a href="#" class="text-blue-700 font-semibold hover:underline text-sm">Xem dạng lịch tháng >></a>
                </div>

                <div class="space-y-4" id="calendarContainer">
                    <div class="text-center py-8 text-gray-500">Đang tải lịch sự kiện...</div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm h-full">
    <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 class="font-bold text-blue-900 uppercase border-l-4 border-yellow-400 pl-2">TIN TỨC MỚI</h3>
    </div>
    
    <div id="newsContainer" class="space-y-3">
        <p class="text-center text-gray-400 py-8">Đang tải tin tức...</p>
    </div>
</div>
        </div>

        <section class="mt-12">
            <div class="flex items-center mb-6">
                <div class="w-2 h-8 bg-purple-600 mr-3"></div>
                <h2 class="text-2xl font-bold text-blue-900 uppercase">Góc Ảnh HUTECH</h2>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="gallery-item rounded-lg h-48">
                    <img src="images/media1.jpg" class="w-full h-full object-cover" onclick="viewImage(this.src)">
                </div>
                <div class="gallery-item rounded-lg h-48">
                    <img src="images/media2.jpg" class="w-full h-full object-cover" onclick="viewImage(this.src)">
                </div>
                <div class="gallery-item rounded-lg h-48">
                    <img src="images/media3.jpg" class="w-full h-full object-cover" onclick="viewImage(this.src)">
                </div>
                <div class="gallery-item rounded-lg h-48">
                    <img src="images/media4.jpg" class="w-full h-full object-cover" onclick="viewImage(this.src)">
                </div>
            </div>
        </section>

    </main>

    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center z-50" onclick="this.classList.add('hidden')">
        <img id="modalImage" src="" class="max-w-[90%] max-h-[90vh] rounded-lg shadow-2xl border-4 border-white">
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/phongTrao.js"></script> </body>
</html>
